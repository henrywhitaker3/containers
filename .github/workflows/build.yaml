name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

# Keep version calculation, changelog updates, builds, and tags in one release
# transaction. GitHub may replace a pending run in a concurrency group, but it
# will not cancel the release already in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      containers: ${{ steps.check.outputs.containers }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          install: true
          cache: true
      - name: Version container
        id: check
        run: |
          CONTAINERS=()

          for dir in *; do
            if [[ ! -d "$dir" ]]; then
              continue
            fi
            if [[ ! -f "$dir/Dockerfile" ]]; then
              continue
            fi
            output=$(task version dir="$dir")
            echo "[$dir]: $output"
            if [[ $(echo "$output" | jq -r '.skip') != "true" ]]; then
              entry=$(echo "$output" | jq -c --arg dir "$dir" '. + {dir: $dir} | del(.changelog)')
              CONTAINERS+=("$entry")
              echo "$output" | jq -r '.changelog' > "$dir/CHANGELOG.md"
              git add "$dir/CHANGELOG.md"
            fi
          done

          echo "containers=[$(
            IFS=,
            echo "${CONTAINERS[*]}"
          )]" >> "$GITHUB_OUTPUT"
      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git stash push --include-untracked -m "changelog updates"
          git rebase origin/main
          git stash pop || true
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore(docs): update changelogs"

  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    needs: [version]
    if: needs.version.outputs.containers != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.version.outputs.containers) }}
    steps:
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          install: true
          cache: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build-and-push
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.dir }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.dir }}:${{ matrix.version }}
      - name: Generate SBOM
        run: |
          image="ghcr.io/${{ github.repository }}/${{ matrix.dir }}@${{ steps.build-and-push.outputs.digest }}"
          mise exec -- trivy image \
            --format cyclonedx \
            --output sbom.cdx.json \
            "$image"
      - name: Scan for vulnerabilites
        run: |
          image="ghcr.io/${{ github.repository }}/${{ matrix.dir }}@${{ steps.build-and-push.outputs.digest }}"
          mise exec -- trivy image \
            --format cosign-vuln \
            --output vuln.json \
            "$image"
      - name: Sign images
        run: |
          image="ghcr.io/${{ github.repository }}/${{ matrix.dir }}@${{ steps.build-and-push.outputs.digest }}"
          mise exec -- cosign sign --yes "$image"
          mise exec -- cosign verify "$image" \
            --certificate-identity=https://github.com/${{ github.repository }}/.github/workflows/build.yaml@refs/heads/main \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          mise exec -- cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "$image"
          mise exec -- cosign attest --yes \
            --predicate vuln.json \
            --type vuln \
            "$image"

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version, build]
    if: needs.version.outputs.containers != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.version.outputs.containers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source_sha }}
      - name: Tag successful build
        run: |
          git tag "${{ matrix.tag }}" "${{ needs.version.outputs.source_sha }}"
          git push origin "${{ matrix.tag }}"
